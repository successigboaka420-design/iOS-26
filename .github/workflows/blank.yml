
name: Build Seko Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Package Deb
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Finished DEB
        uses: actions/upload-artifact@v4
        with:
          name: Seko-Tweak-Deb
          path: packages/*.deb
